const foundation={
explain:`<div class="panel reading"><h2>1. The problem Kubernetes solves</h2><p>Imagine you built a Java Spring Boot API. On your laptop you run <code>java -jar app.jar</code>, open localhost, and everything works. Now 10,000 customers use the app. Your laptop cannot serve them, and the app must stay online when a server crashes, when you release new code, and when traffic spikes. This is the problem Kubernetes helps solve.</p><h3>Before Kubernetes: running apps on servers</h3><p>Traditionally, a team installed software on a virtual machine, configured ports, started a process, and manually monitored it. If the process crashed, somebody restarted it. If traffic doubled, somebody provisioned another machine and configured routing. If a release failed, somebody rolled it back. Each task was possible, but repeated manual work was fragile.</p><h3>Containers solve packaging, not orchestration</h3><p>Docker packages an application and its runtime dependencies into an <strong>image</strong>. A <strong>container</strong> is a running instance of that image. This improves portability, but a container runtime alone does not decide which server should run a container, how many copies should exist, or how traffic reaches healthy copies. Kubernetes is a <strong>container orchestration platform</strong> that coordinates those decisions across machines.</p><div class="notice"><strong>One sentence to remember:</strong> Docker-style tooling packages and runs containers; Kubernetes manages containerized applications across a cluster to keep actual state close to desired state.</div><h2>2. What Kubernetes gives an application developer</h2><ul><li><strong>Scheduling:</strong> choose a suitable worker node for each Pod based on available resources and constraints.</li><li><strong>Self-healing:</strong> restart failed containers and replace missing Pods managed by a controller.</li><li><strong>Scaling:</strong> increase or decrease the number of application replicas.</li><li><strong>Service discovery:</strong> reach changing Pods using a stable Service name and address.</li><li><strong>Rolling updates:</strong> replace old application versions gradually; roll back when necessary.</li><li><strong>Configuration and secrets:</strong> supply environment-specific settings without baking everything into the image.</li><li><strong>Resource management:</strong> request CPU/memory and enforce limits.</li></ul><p>Kubernetes does not automatically make an incorrectly designed app reliable. It also introduces operational complexity. For a single small process on one machine, Docker Compose or a managed application service may be simpler.</p><h2>3. The complete architecture: two halves</h2><p>A <strong>cluster</strong> is a group of machines (physical or virtual) working together. The <strong>control plane</strong> decides what should happen; <strong>worker nodes</strong> run the application's Pods. In a local learning cluster, these roles can share one computer. In production, they are usually separated and replicated for availability.</p><div class="arch"><div class="arch-title">YOU / YOUR TERMINAL</div><div class="arch-box">kubectl → Kubernetes API request</div><div class="arch-arrow">↓</div><div class="arch-title">CONTROL PLANE — cluster decisions</div><div class="arch-grid"><div class="arch-box"><strong>API server</strong><small>Front door for Kubernetes requests</small></div><div class="arch-box"><strong>etcd</strong><small>Stores cluster configuration and state</small></div><div class="arch-box"><strong>Scheduler</strong><small>Assigns unscheduled Pods to nodes</small></div><div class="arch-box"><strong>Controller manager</strong><small>Reconciles desired vs actual state</small></div></div><div class="arch-arrow">↓ scheduling and instructions via API</div><div class="arch-title">WORKER NODES — run the application</div><div class="arch-grid"><div class="arch-box"><strong>Node A</strong><small>kubelet · container runtime · network proxy / dataplane<br>Pod: web-1 · Pod: api-1</small></div><div class="arch-box"><strong>Node B</strong><small>kubelet · container runtime · network proxy / dataplane<br>Pod: web-2 · Pod: api-2</small></div></div><div class="arch-arrow">↔ Services and cluster networking route traffic to Pods</div></div><p><strong>Important:</strong> This is a conceptual diagram, not a literal packet-flow diagram. Components communicate primarily through the API server; the scheduler does not directly tell a worker to launch a container.</p><h2>4. Every architecture component, explained</h2><h3>kube-apiserver — the front door</h3><p>All Kubernetes resources are accessed through the API server. When you run <code>kubectl apply -f deployment.yaml</code>, kubectl sends an API request. The API server authenticates and authorizes the request, validates it, and persists accepted state through the storage layer. Other components watch the API for changes. <strong>CKAD connection:</strong> nearly every kubectl command communicates with the API server.</p><h3>etcd — the cluster's database</h3><p>etcd is a consistent key-value store containing Kubernetes API data such as Deployments, Pods, Services and configuration. It stores the cluster's desired and observed API state; it is <strong>not</strong> your application's normal database. Losing etcd without a recoverable backup can mean losing cluster state.</p><h3>kube-scheduler — the placement decision maker</h3><p>When a Pod has no assigned node, the scheduler evaluates candidate nodes using resource requests, node selectors, affinities, taints/tolerations and other constraints. It selects a suitable node and records that assignment through the API. It does not itself start the container.</p><h3>kube-controller-manager — the continuous repair loop</h3><p>Controllers watch cluster resources and act to reconcile actual state with desired state. Example: a Deployment requests three replicas; if only two are running, its controllers work to create another Pod. A controller is not a one-time script; it keeps checking and correcting differences.</p><h3>cloud-controller-manager — optional cloud integration</h3><p>In many cloud environments, this component integrates Kubernetes with provider-specific infrastructure, such as cloud load balancers and node information. A local cluster may not use it.</p><h3>Worker node — the machine that runs Pods</h3><p>A worker node is a VM or physical server with the software needed to execute application workloads. It provides CPU, memory, networking and storage access.</p><h3>kubelet — the worker's agent</h3><p>kubelet runs on each node, watches Pod specifications assigned to that node, and works with the container runtime to ensure their containers are running. It reports status back to the API. Think: <em>scheduler chooses the node; kubelet makes the assigned Pod run there.</em></p><h3>Container runtime — actually executes containers</h3><p>A runtime such as containerd pulls images and starts/stops containers under the node's operating system. Kubernetes commonly communicates with the runtime through the Container Runtime Interface (CRI). Docker itself is not required on cluster nodes.</p><h3>kube-proxy and networking</h3><p>kube-proxy is a common component that implements Service networking rules on nodes. Some clusters use alternative eBPF-based dataplanes instead. A CNI plugin configures Pod networking. Kubernetes networking allows Pods to communicate across nodes, while Services provide stable ways to access sets of Pods.</p><h3>CoreDNS — names instead of changing IPs</h3><p>CoreDNS typically provides DNS inside the cluster. A Pod can reach a Service using a name such as <code>api.default.svc.cluster.local</code> rather than memorizing Pod IP addresses.</p><h2>5. What are Pods, Deployments, and Services?</h2><p><strong>Pod:</strong> the smallest deployable Kubernetes unit. A Pod contains one or more tightly coupled containers sharing network and storage context. Most app Pods contain one primary container. Pods can be replaced, so don't treat a Pod's name or IP as permanent.</p><p><strong>Deployment:</strong> a declarative controller for stateless workloads. You specify an image and replica count; the Deployment manages ReplicaSets, which manage Pods. It supports rollout and rollback.</p><p><strong>Service:</strong> a stable network abstraction that routes traffic to matching Pods. A Service uses labels/selectors to find endpoints, so the application can survive Pod replacements without clients tracking changing Pod IPs.</p><p><strong>Namespace:</strong> a logical scope for namespaced resources, useful for separating development and testing. It is not a complete security boundary on its own.</p><h2>6. The complete story when you deploy an app</h2><ol><li>You write YAML declaring a Deployment with <code>replicas: 3</code> and an nginx container image.</li><li>You run <code>kubectl apply -f deployment.yaml</code>. kubectl sends the manifest to the API server.</li><li>The API server validates the request and records the new desired state in etcd.</li><li>The Deployment controller creates or updates a ReplicaSet; the ReplicaSet controller creates three Pod objects.</li><li>The scheduler selects a worker node for each unscheduled Pod.</li><li>The kubelet on each selected node asks its container runtime to pull the image and start the container.</li><li>kubelets report Pod/container status through the API. You inspect it using <code>kubectl get pods -o wide</code>.</li><li>If a node fails, controllers can arrange replacement Pods on available nodes (subject to constraints and capacity). A Service continues routing to ready endpoints.</li></ol><h2>7. Desired state vs actual state</h2><p>This is the most important mental model. <strong>Desired state</strong> is what you declare, such as three replicas. <strong>Actual state</strong> is what currently exists, such as two healthy Pods. Controllers repeatedly attempt to close the gap. If there is insufficient capacity, Kubernetes cannot magically create resources; you must troubleshoot the reason.</p><h2>8. When should you use Kubernetes?</h2><p>Use it when multiple containerized services need consistent deployment, availability, networking, scaling, and automation across machines. It is particularly useful for microservices and teams already operating Kubernetes. Avoid it as a default for a tiny one-off app if a simpler platform meets the requirements. CKAD focuses on building and troubleshooting workloads <em>inside</em> Kubernetes rather than administering the entire control plane.</p><div class="notice"><strong>Today's success criterion:</strong> Without notes, explain the difference between cluster, node, Pod, Deployment, and Service; describe each control-plane component; then narrate the eight-step deployment journey.</div></div>`,
example:`<div class="panel reading"><h2>Guided walkthrough: follow a deployment from YAML to running Pods</h2><p><strong>Prerequisite:</strong> a working local cluster. Day 2 walks through setup. If you do not have one yet, read the commands and return after setup.</p><h3>Step 1 — check which cluster you're using</h3><pre><code>kubectl config current-context
kubectl cluster-info
kubectl get nodes -o wide</code></pre><p><strong>Expected:</strong> a context name, control-plane address, and at least one node. A connection-refused error usually means the cluster is not running or the context is wrong.</p><h3>Step 2 — create a Deployment</h3><pre><code>kubectl create deployment academy-web --image=nginx:stable --replicas=3
kubectl get deployments
kubectl get replicasets
kubectl get pods -o wide</code></pre><p><strong>Observe:</strong> one Deployment, one ReplicaSet, and three Pods (after scheduling and startup). Their exact names and node placements vary. Notice how the Deployment is not itself a container.</p><h3>Step 3 — inspect the relationships</h3><pre><code>kubectl describe deployment academy-web
kubectl get pods -l app=academy-web
kubectl describe pod &lt;replace-with-a-real-pod-name&gt;</code></pre><p><strong>Observe:</strong> desired/available replicas, image, labels, events, assigned node and container state. The final command uses a placeholder: replace it with a Pod name from <code>kubectl get pods</code>.</p><h3>Step 4 — demonstrate reconciliation</h3><pre><code>kubectl scale deployment academy-web --replicas=2
kubectl get pods -w</code></pre><p><strong>Observe:</strong> Kubernetes reduces the Pod count toward two. Press Ctrl+C to stop watching. Try scaling back to three.</p><pre><code>kubectl scale deployment academy-web --replicas=3
kubectl rollout status deployment/academy-web</code></pre><h3>Step 5 — give the Pods a stable Service</h3><pre><code>kubectl expose deployment academy-web --name=academy-svc --port=80 --target-port=80
kubectl get svc academy-svc
kubectl get endpointslices -l kubernetes.io/service-name=academy-svc</code></pre><p><strong>Observe:</strong> the Service has a stable name while its endpoints correspond to the selected Pods. On some environments, endpoints may take time to appear until Pods are ready.</p><h3>Step 6 — clean up</h3><pre><code>kubectl delete service academy-svc
kubectl delete deployment academy-web</code></pre><p><strong>Explain aloud:</strong> Which component accepted your request? Which component decided Pod placement? Which component started containers? Which controller maintained replicas?</p></div>`,
notes:`<div class="panel reading"><h2>Day 1 revision sheet</h2><p><strong>Cluster:</strong> control plane + worker nodes.</p><p><strong>Control plane:</strong> API server (requests), etcd (state), scheduler (placement), controller manager (reconciliation), optional cloud controller manager (cloud integration).</p><p><strong>Worker node:</strong> kubelet (agent), container runtime (starts containers), networking components (connectivity).</p><p><strong>Pod:</strong> one or more containers, smallest deployable unit.</p><p><strong>Deployment → ReplicaSet → Pods:</strong> a common controller ownership chain for stateless applications.</p><p><strong>Service:</strong> stable discovery and access to matching Pod endpoints.</p><p><strong>Core principle:</strong> declarative desired state + continuous reconciliation.</p><h3>Commands worth memorizing</h3><pre><code>kubectl config current-context
kubectl cluster-info
kubectl get nodes -o wide
kubectl get pods -A
kubectl get deployments,replicasets,pods
kubectl describe pod POD_NAME
kubectl get events -A --sort-by=.lastTimestamp</code></pre><h3>Interview-style recall</h3><ol><li>Why are containers alone insufficient for a large multi-server application?</li><li>What is the difference between scheduler and kubelet?</li><li>Why do we need etcd?</li><li>What happens after a Deployment is submitted?</li><li>Why should applications connect to Services instead of individual Pod IPs?</li><li>What happens if you ask for five replicas but the cluster lacks CPU?</li></ol><p>Write answers in your own words before checking the lesson.</p></div>`
};
function foundationLab(){return `<div class="panel reading"><h2>Day 1 — architecture exercises (35 minutes)</h2><ol><li><strong>5 min:</strong> Draw two boxes labeled control plane and worker node. Place API server, etcd, scheduler, controller manager, kubelet and runtime in the correct boxes.</li><li><strong>5 min:</strong> Explain in plain English how <code>kubectl</code> reaches a running Pod. Include the API server, controller, scheduler and kubelet.</li><li><strong>5 min:</strong> Match each scenario: a Pod needs a node; a container needs starting; a replica is missing; a request needs validating; an app needs a stable hostname.</li><li><strong>10 min:</strong> If your cluster is ready, run the following commands and identify nodes, Pods and namespaces.</li><li><strong>10 min:</strong> Create a Deployment with two replicas, inspect its ReplicaSet and Pods, then scale to three and verify.</li></ol><pre><code>kubectl cluster-info
kubectl get nodes -o wide
kubectl get pods -A
kubectl create deployment day1-web --image=nginx:stable --replicas=2
kubectl get deploy,rs,pods
kubectl scale deployment day1-web --replicas=3
kubectl rollout status deployment/day1-web
kubectl delete deployment day1-web</code></pre><h3>Answers to the scenario matching</h3><details><summary>Reveal after attempting</summary><p>Pod needs a node → scheduler. Start a container → kubelet + container runtime. Missing replica → controllers. Validate a request → API server. Stable hostname → Service + cluster DNS.</p></details></div>${task('lab','I completed the exercises and explained the architecture without notes.')}`}
function foundationProject(){return `<div class="panel reading"><span class="pill">15-minute mini project</span><h2>Project: Trace the lifecycle of a web app</h2><p><strong>Outcome:</strong> deploy a small nginx app and create a short architecture map showing how it became a running Pod.</p><p><strong>0–3 min:</strong> Draw: terminal → API server → etcd / controllers → scheduler → kubelet → runtime → Pod.</p><p><strong>3–8 min:</strong> Run these commands in a disposable cluster:</p><pre><code>kubectl create deployment trace-web --image=nginx:stable --replicas=2
kubectl get deployment,replicaset,pods -o wide</code></pre><p><strong>8–12 min:</strong> Identify the Pod's node, then describe a Pod and find its events:</p><pre><code>kubectl get pods -l app=trace-web -o wide
kubectl describe deployment trace-web</code></pre><p><strong>12–15 min:</strong> Scale to three replicas and explain which controller notices the difference. Clean up:</p><pre><code>kubectl scale deployment trace-web --replicas=3
kubectl get pods -l app=trace-web
kubectl delete deployment trace-web</code></pre><p><strong>Definition of done:</strong> you can show the Deployment, ReplicaSet and Pods and explain why all three exist.</p></div>${task('project','I built the trace project and verified the replica change.')}`}
function foundationQuiz(){return `<div class="panel reading"><h2>Day 1 — knowledge test</h2><p>Answer without notes, then open the solutions.</p><ol><li>What problem does Kubernetes solve that Docker alone does not?</li><li>What are the two major parts of a Kubernetes cluster?</li><li>Which component handles API requests?</li><li>Where is cluster API state stored?</li><li>Who chooses a node for an unscheduled Pod?</li><li>Who ensures containers run on the assigned node?</li><li>What is the difference between a Pod and a Deployment?</li><li>Why is a Service useful when Pods are replaced?</li><li>What does reconciliation mean?</li><li>Describe the journey of <code>kubectl apply -f app.yaml</code> to a running container.</li></ol><details><summary>Show model answers</summary><ol><li>It orchestrates containerized apps across machines: scheduling, replicas, networking, recovery and rollout.</li><li>Control plane and worker nodes.</li><li>kube-apiserver.</li><li>etcd.</li><li>kube-scheduler.</li><li>kubelet working with the container runtime.</li><li>A Pod runs containers; a Deployment manages desired replicas and updates through ReplicaSets.</li><li>It provides a stable name and routes to matching healthy endpoints.</li><li>Controllers continually try to make actual state match declared desired state.</li><li>API server validates/persists → controllers create ReplicaSet/Pods → scheduler assigns nodes → kubelet/runtime start containers → status is reported.</li></ol></details><p><strong>Pass target:</strong> at least 8/10 correct without notes, and be able to draw the architecture from memory.</p></div>${task('quiz','I answered at least 8/10 questions correctly without notes.')}`}
function lesson(d){if(selected===0)return `<div class="subnav">${[['explain','Deep explanation'],['example','Guided walkthrough'],['notes','Revision notes']].map(([k,v])=>`<button class="${sub===k?'active':''}" data-sub="${k}">${v}</button>`).join('')}</div>${foundation[sub]}${task('lesson','I studied the full architecture and can explain it from memory.')}`;const noun=d.concept.split(',')[0];return `<div class="subnav">${[['explain','Beginner explanation'],['example','Worked example'],['notes','Revision notes']].map(([k,v])=>`<button class="${sub===k?'active':''}" data-sub="${k}">${v}</button>`).join('')}</div>${sub==='explain'?`<div class="panel"><h2>What are we learning?</h2><p><strong>${esc(d.title)}</strong> is today's Kubernetes skill. The key ideas are <strong>${esc(d.concept)}</strong>.</p><p>Kubernetes is a system that keeps your applications running according to a declared desired state. You describe what you want; controllers repeatedly compare that goal with the actual cluster and reconcile differences. Today, focus on where <strong>${esc(noun)}</strong> fits in that process.</p><h3>Think about it this way</h3><p>Your YAML is an instruction sheet, the Kubernetes API stores that instruction, and the cluster works to make reality match it. Use <code>kubectl get</code> to inspect the result and <code>kubectl describe</code> to understand why something happened.</p><div class="notice">Beginner rule: never memorize a command without running it, inspecting the result, and changing one thing to see what happens.</div></div>`:sub==='example'?`<div class="panel"><h2>Follow along</h2><p>First, confirm the correct cluster and namespace before changing resources.</p><pre><code>kubectl config current-context
kubectl get namespaces
${esc(d.command)}</code></pre><p>Next, inspect the resources affected by your command. If a command fails, read the error and use <code>kubectl explain</code> or <code>kubectl describe</code> rather than guessing.</p><pre><code>kubectl get pods -A
kubectl get events -A --sort-by=.lastTimestamp</code></pre><p>Explain aloud what changed and why. The command shown is a practice starting point; adapt names and namespaces to your cluster.</p></div>`:`<div class="panel"><h2>Memory anchors</h2><p><strong>Topic:</strong> ${esc(d.title)}</p><p><strong>Keywords:</strong> ${esc(d.concept)}</p><p><strong>Command to recall:</strong></p><pre><code>${esc(d.command)}</code></pre><p><strong>Exam habit:</strong> Check context → create/change → verify → move on.</p><p><strong>Teach-back question:</strong> When would you use this feature, and how would you prove it works?</p></div>`}${task('lesson','I read the explanation, ran the example, and explained the concept in my own words.')}`}
function lab(d){if(selected===0)return foundationLab();return `<div class="panel"><h2>Hands-on exercises</h2><p>Estimated time: 20–30 minutes. Work in a disposable local cluster. Replace names and namespaces as needed.</p>${['Run the command below and inspect its output.',d.exercise,'Inspect the created/modified resource with kubectl get and kubectl describe.','Make one intentional mistake, observe the error/events, then fix it.','Clean up temporary resources and write down one lesson learned.'].map((x,i)=>`<div class="task"><span class="pill">${i+1}</span><label>${esc(x)}</label></div>`).join('')}<pre><code>${esc(d.command)}</code></pre><h3>Self-test (no notes)</h3><p>Explain what the command does, what resource it touches, and how you would verify the expected state.</p></div>${task('lab','I completed the lab and verified the results in my cluster.')}`}
function project(d){if(selected===0)return foundationProject();return `<div class="panel"><span class="pill">15-minute mini project</span><h2 style="margin-top:15px">${esc(d.project)}</h2><p><strong>Goal:</strong> Demonstrate today's concept with a small working artifact, not just a copied command.</p><div class="task"><span class="pill">0–3 min</span><label>Plan the resources and choose a namespace.</label></div><div class="task"><span class="pill">3–10 min</span><label>${esc(d.project)}. Use today's command as a starting point.</label></div><div class="task"><span class="pill">10–13 min</span><label>Verify using get, describe, logs or a functional test as appropriate.</label></div><div class="task"><span class="pill">13–15 min</span><label>Write down the commands used, expected outcome, and one failure you could troubleshoot.</label></div><h3>Starter command</h3><pre><code>${esc(d.command)}</code></pre><p class="muted">Some exercises need a configured cluster, ingress controller, CNI policy enforcement, storage class or Helm installation. If unavailable, validate the manifest locally and record the limitation.</p></div>${task('project','I finished the mini project and checked that it works.')}`}
function quiz(d){if(selected===0)return foundationQuiz();let options=[`Run a command, inspect the resource, and verify desired state`,`Assume a command succeeded without checking`,`Edit production resources before checking context`,`Memorize YAML without practicing`];return `<div class="panel"><h2>Knowledge check</h2><p>What is the best workflow when practicing <strong>${esc(d.title)}</strong>?</p>${options.map((x,i)=>`<button class="quiz-option ${answer===i?'chosen':''}" data-answer="${i}">${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join('')}${answer!==null?`<div class="feedback">${answer===0?'Correct! Verification is essential in the performance-based CKAD exam.':'Not quite. The best answer is A: run, inspect, and verify.'}</div>`:''}<h3>Oral exam prompts</h3><p>1. Explain ${esc(d.concept)} in your own words.</p><p>2. Without looking, type: <code>${esc(d.command)}</code></p><p>3. What would you inspect first if the result were wrong?</p></div>${task('quiz','I answered the prompts without looking at notes.')}`}
function render(){renderNav();const d=days[selected],completed=days.filter((_,i)=>done(i)).length,checks=days.reduce((n,_,i)=>n+['lesson','lab','project','quiz'].filter(k=>state(i)[k]).length,0);$('#content').innerHTML=`<div class="eyebrow">Day ${selected+1} of ${days.length} · ${date(d.date)} · ${esc(d.phase)}</div><h1>${esc(d.title)}</h1><p class="muted">${esc(d.concept)}</p><div class="stats"><div class="stat"><b>${completed}/${days.length}</b><small>Days completed</small></div><div class="stat"><b>${Math.round(checks/(days.length*4)*100)}%</b><small>Total progress</small></div><div class="stat"><b>${Math.max(0,days.length-completed)}</b><small>Days remaining</small></div></div><div class="progress"><div style="width:${checks/(days.length*4)*100}%"></div></div><div class="meta"><span class="pill">📖 30 min learning</span><span class="pill">⌨ 30 min practice</span><span class="pill">🛠 15 min project</span><span class="pill">✓ Recall quiz</span></div><div class="tabs">${[['lesson','📖 Lesson'],['lab','⌨ Exercises'],['project','🛠 Mini project'],['quiz','✓ Test yourself']].map(([k,v])=>`<button class="tab ${tab===k?'active':''}" data-tab="${k}">${v}${state(selected)[k]?' ✓':''}</button>`).join('')}</div>${tab==='lesson'?lesson(d):tab==='lab'?lab(d):tab==='project'?project(d):quiz(d)}<div class="actions"><button class="secondary" id="prev" ${selected===0?'disabled':''}>← Previous day</button><button class="primary" id="next" ${selected===days.length-1?'disabled':''}>Next day →</button></div><p class="footer">Progress is saved in this browser only. Export a backup regularly. Exam objectives and policies can change; confirm details on the official CNCF/Linux Foundation CKAD pages. <a href="https://kubernetes.io/docs/" target="_blank" style="color:#2563eb">Kubernetes documentation</a> · <a href="https://training.linuxfoundation.org/certification/certified-kubernetes-application-developer-ckad/" target="_blank" style="color:#2563eb">CKAD exam page</a></p>`;document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;answer=null;render()});document.querySelectorAll('[data-sub]').forEach(x=>x.onclick=()=>{sub=x.dataset.sub;render()});document.querySelectorAll('[data-mark]').forEach(x=>x.onchange=()=>mark(x.dataset.mark,x.checked));document.querySelectorAll('[data-answer]').forEach(x=>x.onclick=()=>{answer=+x.dataset.answer;render()});$('#prev').onclick=()=>select(selected-1);$('#next').onclick=()=>select(selected+1)}function select(i){if(i<0||i>=days.length)return;selected=i;tab='lesson';sub='explain';answer=null;$('#sidebar').classList.remove('open');$('#overlay').classList.remove('open');render();window.scrollTo(0,0)}$('#hamb').onclick=()=>{$('#sidebar').classList.toggle('open');$('#overlay').classList.toggle('open')};$('#overlay').onclick=()=>{$('#sidebar').classList.remove('open');$('#overlay').classList.remove('open')};$('#reset').onclick=()=>{const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),progress},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ckad-progress.json';a.click();URL.revokeObjectURL(a.href)};render();

const deepTopics=[
['architecture|mental model','Kubernetes is a reconciliation system: you declare the desired state, and controllers repeatedly work to make actual state match it. The API server is the front door, etcd stores cluster objects, scheduler assigns unscheduled Pods, kubelet manages Pod execution on each node, and the container runtime runs containers.','A Deployment creates ReplicaSets, which create Pods. The scheduler chooses a node for each unscheduled Pod; kubelet then asks the runtime to start its containers. A Service provides a stable address while Pods come and go.','kubectl get nodes -o wide\nkubectl get pods -A\nkubectl get deployments -A\nkubectl cluster-info','Why does a Deployment not directly start a container? Trace each object and component involved.'],
['setup|context|navigation|imperative|jsonpath','kubectl is a client for the Kubernetes API. A kubeconfig stores clusters, credentials and contexts. The current context determines which cluster and default namespace commands target. Explicitly selecting the namespace avoids mistakes.','Inspect before changing anything: get gives a summary, describe gives status and events, explain documents fields, and -o yaml reveals the stored object. Generate YAML with --dry-run=client -o yaml to save typing.','kubectl config get-contexts\nkubectl config current-context\nkubectl api-resources\nkubectl explain pod.spec.containers\nkubectl get pods -A -o wide','What is the difference between context and namespace? How would you confirm both before editing?'],
['pod|container|image|lifecycle','A Pod is the smallest schedulable unit and contains one or more tightly coupled containers. Containers in a Pod share networking and can share volumes. Pods are replaceable, so use a controller for long-running applications.','Pod phase is not the same as container state. A Running Pod can have a crashing container. Read status, events, container logs, and previous logs before changing the manifest.','kubectl run demo --image=nginx:1.27 --restart=Never\nkubectl get pod demo -o wide\nkubectl describe pod demo\nkubectl logs demo\nkubectl delete pod demo','Why should a production web API generally use a Deployment instead of a bare Pod?'],
['yaml|manifest|declarative','A manifest has apiVersion, kind, metadata, and spec. metadata.name identifies the object; metadata.labels enable selection. spec describes what you want. status is observed state and normally is not authored.','YAML indentation defines nesting. Container configuration belongs under spec.containers, while a Deployment nests a Pod template under spec.template.spec. Validate using kubectl apply --dry-run=client and kubectl explain.','kubectl run web --image=nginx --dry-run=client -o yaml > pod.yaml\nkubectl apply -f pod.yaml\nkubectl get pod web -o yaml\nkubectl delete -f pod.yaml','Where do labels go in a Pod versus a Deployment template?'],
['deployment|replica|rollout|scale|strategy|canary|blue','A Deployment declares a desired number of interchangeable Pods. It owns ReplicaSets and replaces failed Pods. Rolling updates transition between ReplicaSets using maxSurge and maxUnavailable.','A rollout is not complete until new Pods become available. Inspect rollout status and history; rollback using rollout undo. For canary routing with a Service, carefully control matching labels and replica proportions; those ratios are approximate.','kubectl create deployment web --image=nginx:1.27 --replicas=3\nkubectl set image deployment/web nginx=nginx:1.28\nkubectl rollout status deployment/web\nkubectl rollout history deployment/web\nkubectl rollout undo deployment/web','How do maxSurge=1 and maxUnavailable=0 affect an update with three replicas?'],
['service|dns|endpoint|network|ingress','Pod IP addresses are ephemeral. A Service gives clients a stable DNS name and routes traffic to selected ready endpoints. A Service selector must match Pod labels; port is the Service-facing port, targetPort is the Pod-facing port.','ClusterIP is internal, NodePort exposes a port on nodes, and LoadBalancer requires suitable infrastructure. Ingress needs an installed controller; defining an Ingress object alone does not create a functioning router.','kubectl expose deployment web --name=web-svc --port=80 --target-port=80\nkubectl get svc web-svc\nkubectl get endpointslices -l kubernetes.io/service-name=web-svc\nkubectl describe svc web-svc','A Service has no endpoints: which two resources do you inspect first?'],
['policy','NetworkPolicy selects destination Pods using podSelector and controls allowed ingress and/or egress. Policies are additive, not ordered firewall rules. They require a CNI plugin that enforces NetworkPolicy.','A default-deny ingress policy isolates selected Pods from incoming connections. To allow a frontend, write a policy that selects backend Pods and permits traffic from Pods with the right label and port.','kubectl get networkpolicy -A\nkubectl explain networkpolicy.spec.ingress\nkubectl describe networkpolicy -n default','If both source egress and destination ingress are isolated, what must be allowed?'],
['configmap|secret|environment|configuration','ConfigMaps hold non-confidential settings; Secrets are intended for sensitive values but are not automatically a complete encryption or access-control solution. Both can be mounted as files or consumed as environment variables.','An environment variable sourced from a ConfigMap is captured when the container starts; a mounted ConfigMap volume can update eventually, except subPath mounts. A Secret should not be printed unnecessarily into logs or committed to source control.','kubectl create configmap app-settings --from-literal=MODE=dev\nkubectl create secret generic app-creds --from-literal=TOKEN=example\nkubectl get configmap app-settings -o yaml\nkubectl explain pod.spec.containers.envFrom','Why is a Secret preferable to a ConfigMap for a password, and what safeguards are still needed?'],
['volume|persistent|storage|pvc','An emptyDir volume lasts as long as its Pod and is useful for scratch files shared by containers. A PersistentVolumeClaim requests durable storage through a StorageClass or available PV.','A PVC can stay Pending if no matching volume or provisioner exists. Verify storage classes, access modes, capacity, PVC events and the Pod mount path.','kubectl get storageclass\nkubectl get pvc -A\nkubectl explain pod.spec.volumes\nkubectl explain persistentvolumeclaim.spec','What happens to emptyDir data when the Pod is deleted?'],
['probe|health|readiness|liveness|startup','Readiness decides whether a Pod should receive Service traffic. Liveness restarts a stuck container. Startup delays liveness/readiness checks until a slow-starting app initializes.','Do not make liveness depend on fragile external dependencies: a temporary database outage could trigger restart loops. Use the correct HTTP path, port, delay, period and failure threshold.','kubectl explain pod.spec.containers.readinessProbe\nkubectl describe pod web\nkubectl get pod web -w','Why can a Running Pod receive no Service traffic?'],
['job|cronjob|batch','A Job runs Pods until the specified number of successful completions. A CronJob creates Jobs on a schedule. A Job is not a substitute for a long-running Deployment.','Pay attention to completions, parallelism, backoffLimit, restartPolicy and the CronJob concurrencyPolicy. Cron schedules use five fields and the controller is not a strict real-time scheduler.','kubectl create job report --image=busybox:1.36 -- echo done\nkubectl create cronjob nightly --image=busybox:1.36 --schedule="0 2 * * *" -- date\nkubectl get jobs,cronjobs','How do completions=3 and parallelism=2 differ?'],
['security|serviceaccount|rbac|capabilit|quota|limit|request','A ServiceAccount identifies workloads to the Kubernetes API; RBAC grants permissions to identities. SecurityContext sets Linux process and filesystem constraints. Requests influence scheduling and limits constrain resource consumption.','A Pod may remain Pending if requests exceed allocatable node resources or a quota is exceeded. A restricted container may fail if it needs root, writable root filesystem, or additional capabilities.','kubectl get serviceaccounts\nkubectl auth can-i get pods --as=system:serviceaccount:default:default\nkubectl describe resourcequota -n default\nkubectl explain pod.spec.securityContext','What is the difference between a CPU request and a CPU limit?'],
['helm|kustomize','Helm packages Kubernetes resources into charts with configurable values. Kustomize modifies a base set of manifests using overlays and patches without templating everything.','For Helm, inspect chart defaults and rendered manifests before installation. For Kustomize, build the overlay and inspect output before applying. Both still submit Kubernetes objects to the API server.','helm list -A\nhelm template demo ./chart\nkubectl kustomize ./overlays/dev\nkubectl apply -k ./overlays/dev','When would you use a Kustomize overlay rather than editing a shared base manifest?'],
['observ|debug|troubleshoot|logs|event','Troubleshooting starts by identifying the failing layer: API admission, scheduling, image pull, container start, readiness, Service selection, or DNS/networking. Observe before changing.','Use get to find status, describe for events, logs --previous for restarts, exec for in-container checks, and get endpointslices for Services. Verify the fix by testing the actual application path.','kubectl get pods -A -o wide\nkubectl describe pod demo\nkubectl logs demo --previous\nkubectl get events --sort-by=.lastTimestamp','What would you inspect first for ImagePullBackOff versus CrashLoopBackOff?']
];
function deepFor(d){let t=(d.title+' '+d.concept).toLowerCase();return deepTopics.find(x=>x[0].split('|').some(k=>t.includes(k)))||deepTopics[1]}
function codebox(v){return `<pre style="white-space:pre-wrap;overflow:auto;background:#f1f5f9;color:#0f172a;border:1px solid #dbe3ef;border-radius:10px;padding:16px;line-height:1.65">${esc(v)}</pre>`}
const oldLesson=lesson;
lesson=function(d){if(selected===0)return oldLesson(d)+`<div class="panel reading"><h2>Architecture checkpoint: from request to running Pod</h2><p><strong>Step 1.</strong> You send a manifest to the API server. Authentication, authorization, admission and schema validation happen before the object is stored. <strong>Step 2.</strong> The Deployment controller notices the desired replicas and creates or updates a ReplicaSet. <strong>Step 3.</strong> The ReplicaSet controller creates Pod objects. <strong>Step 4.</strong> The scheduler assigns unscheduled Pods to suitable nodes. <strong>Step 5.</strong> Each node's kubelet sees its assigned Pods and directs the container runtime to start containers. <strong>Step 6.</strong> Readiness checks and EndpointSlices determine which Pods can receive Service traffic. This is a reconciliation loop, not a single script.</p><h3>Self-check</h3><p>Explain the difference between an API object, a controller, a Pod, and a container. Then describe what changes if a node disappears. Draw this flow without reading.</p></div>`;
const q=deepFor(d);let example=q[3].replaceAll('\\n','\n');return `<div class="panel reading"><span class="pill">Deep lesson · approximately 30–45 minutes</span><h2>Why this topic matters</h2><p>${esc(q[1])}</p><h2>How it works in a real application</h2><p>${esc(q[2])}</p><h2>Walkthrough: inspect, change, verify</h2><p>First confirm the active context and namespace. Next run the commands one at a time. After every command, inspect the result and compare it to your intended state. Never assume success merely because the command exited with code zero.</p>${codebox('kubectl config current-context\nkubectl get namespace\n'+example)}<h2>Understand every command</h2><p><strong>kubectl</strong> sends a request to the Kubernetes API. <strong>get</strong> reads objects; <strong>describe</strong> explains status and events; <strong>explain</strong> shows the API schema. A resource name identifies the object, while <code>-n</code> selects its namespace. Use <code>--dry-run=client -o yaml</code> to draft manifests, then apply and verify.</p><h2>Common exam mistakes</h2><p>Working in the wrong namespace; confusing Pod labels with Deployment labels; using the wrong container name; forgetting to check events; assuming a resource exists merely because YAML was accepted; and using a feature that depends on a missing controller or storage provisioner.</p><h2>Teach it back</h2><p>${esc(q[4])}</p><p><a target="_blank" rel="noopener" href="https://kubernetes.io/docs/tasks/">Official Kubernetes task tutorials ↗</a> · <a target="_blank" rel="noopener" href="https://kubernetes.io/docs/reference/kubectl/">kubectl reference ↗</a></p></div>${task('lesson','I can explain the topic without looking at the notes.')}`};
lab=function(d){let q=deepFor(d),cmd=q[3].replaceAll('\\n','\n');return `<div class="panel reading"><h2>Guided lab: ${esc(d.title)}</h2><p><strong>Environment:</strong> use a disposable kind/minikube cluster. Create a separate namespace so you can safely reset your work.</p>${codebox('kubectl create namespace ckad-lab --dry-run=client -o yaml | kubectl apply -f -\nkubectl config set-context --current --namespace=ckad-lab')}<h3>Exercise A — Guided (10 minutes)</h3><p>${esc(d.exercise)}. Use this command sequence as a starting point. Some commands depend on objects created in earlier lessons; adapt names when necessary.</p>${codebox(cmd)}<h3>Exercise B — Independent (10 minutes)</h3><p>Repeat the task with different resource names and a second namespace. Use <code>kubectl explain</code> rather than copying YAML. Write down the commands you needed.</p><h3>Exercise C — Troubleshooting (10 minutes)</h3><p>Intentionally introduce one error (wrong image tag, label, port, or field where relevant). Predict the symptom, inspect <code>kubectl describe</code>, events and logs, then repair it.</p><h3>Validation and hints</h3>${codebox('kubectl get all -n ckad-lab\nkubectl get events -n ckad-lab --sort-by=.lastTimestamp\nkubectl get pods -n ckad-lab -o wide')}<p><strong>Answer principle:</strong> a correct solution is a verified cluster state, not a particular sequence of commands. For troubleshooting, explain what failed and why your fix works.</p></div>${task('lab','I completed and verified the exercises in a real cluster.')}`};
project=function(d){return `<div class="panel reading"><span class="pill">15-minute build challenge</span><h2>${esc(d.project)}</h2><p><strong>Scenario:</strong> you are the application developer on call. Your team needs a reproducible solution using today's Kubernetes feature. Start with a clean namespace and build it without pasting a finished manifest.</p><ol><li><strong>Minutes 0–3:</strong> translate the requirement into resource names, labels and expected behavior.</li><li><strong>Minutes 3–10:</strong> create or edit the resources using kubectl and YAML.</li><li><strong>Minutes 10–13:</strong> test the application or inspect resource status and events.</li><li><strong>Minutes 13–15:</strong> delete temporary objects and write a three-line runbook.</li></ol><h3>Acceptance criteria</h3><p>${esc(d.project)}. The intended resource exists in the correct namespace, its relevant fields match the requirement, and you can demonstrate the behavior with a command or test.</p>${codebox('kubectl get all -n ckad-lab\nkubectl get events -n ckad-lab --sort-by=.lastTimestamp')}<p><strong>Stretch:</strong> repeat with a two-minute time limit for the resource creation step.</p></div>${task('project','I built and validated the mini project.')}`};
quiz=function(d){let q=deepFor(d);return `<div class="panel reading"><h2>Active recall test</h2><p>Answer without notes before opening the suggested explanation.</p><ol><li>What problem does today's Kubernetes resource solve?</li><li>Which API object owns or selects the resource, if applicable?</li><li>${esc(q[4])}</li><li>What command would you run to verify the result?</li><li>What is one realistic failure mode, and how would you diagnose it?</li></ol><details><summary>Reveal explanation and suggested checks</summary><p>${esc(q[1])} ${esc(q[2])}</p>${codebox(q[3].replaceAll('\\n','\n'))}<p>Use describe, logs, events and relevant selectors to verify actual state.</p></details><p><strong>Pass rule:</strong> explain at least four of five answers clearly, and demonstrate the key commands in your cluster.</p></div>${task('quiz','I answered at least 4/5 recall questions correctly.')}`};

// Instructor answer keys: every day has worked solutions, rationale and checks.
const answerGuides={
'Pods from the CLI':['kubectl run web --image=nginx --restart=Never\nkubectl get pod web -o wide\nkubectl describe pod web\nkubectl logs web\nkubectl delete pod web','The run command creates a standalone Pod. get checks phase and assigned node, describe shows events and container state, logs reads stdout/stderr, and delete cleans up.','A Pod may remain Pending if no node can schedule it, or show ImagePullBackOff if its image cannot be retrieved.'],
'Pod YAML anatomy':['kubectl run web --image=nginx --restart=Never --dry-run=client -o yaml > web.yaml\nkubectl apply -f web.yaml\nkubectl get pod web -o yaml','apiVersion and kind select the Kubernetes API type, metadata names the object, and spec describes the desired container. --dry-run=client generates YAML without creating the object.','Validate schema with kubectl explain pod.spec and check the generated manifest before applying.'],
'Namespaces and contexts':['kubectl create namespace dev\nkubectl create namespace test\nkubectl run web --image=nginx -n dev\nkubectl get pods -n dev\nkubectl get pods -n test','Namespaces scope namespaced resources. The same Pod name can exist independently in dev and test; -n selects the target namespace.','Always verify the current context and namespace before changing cluster resources.'],
'Labels and selectors':['kubectl run blue --image=nginx --labels=app=web,tier=frontend\nkubectl run green --image=nginx --labels=app=api,tier=backend\nkubectl get pods -l app=web --show-labels\nkubectl label pod green team=platform','Labels are structured key/value metadata used by selectors. Services and workload controllers use selectors to identify matching Pods.','A Service with a selector that matches no Pods will not route to those Pods.'],
'Deployments basics':['kubectl create deployment web --image=nginx\nkubectl scale deployment web --replicas=3\nkubectl rollout status deployment/web\nkubectl get deployment,replicaset,pods -l app=web','A Deployment controls ReplicaSets, which maintain the desired number of Pods. Scaling updates desired replicas; the controller creates or removes Pods.','Deleting a managed Pod usually causes a replacement Pod to be created.'],
'Rollouts and rollback':['kubectl create deployment web --image=nginx:1.25\nkubectl set image deployment/web nginx=nginx:invalid-tag\nkubectl rollout status deployment/web --timeout=30s\nkubectl rollout undo deployment/web\nkubectl rollout status deployment/web','Changing the container image updates the Pod template and creates a new ReplicaSet. An invalid image causes the rollout to stall; undo restores the previous template.','Use kubectl describe pods and rollout history to identify the failing revision.'],
'Services: ClusterIP':['kubectl create deployment web --image=nginx\nkubectl expose deployment web --port=80 --target-port=80\nkubectl get svc web\nkubectl get endpointslices -l kubernetes.io/service-name=web','A ClusterIP Service provides a stable virtual IP and DNS name while Pods can be replaced. Its selector must match the backend Pod labels.','Service port is the exposed port; targetPort is the destination container port.'],
'ConfigMaps':['kubectl create configmap settings --from-literal=MODE=dev\nkubectl get configmap settings -o yaml\nkubectl run config-demo --image=busybox:1.36 --restart=Never --env=MODE=dev -- sh -c "echo $MODE"\nkubectl logs config-demo','A ConfigMap separates non-sensitive configuration from images. For real references use env.valueFrom.configMapKeyRef or a ConfigMap volume; the example first verifies the setting independently.','Environment variables from a ConfigMap are not updated in an already-running container.'],
'Secrets':['kubectl create secret generic creds --from-literal=username=demo\nkubectl get secret creds\nkubectl explain pod.spec.containers.env.valueFrom.secretKeyRef','Secrets are intended for sensitive values, but base64 is encoding, not encryption. Use RBAC, encryption at rest where configured, and avoid leaking values into logs.','Never print production Secret values or commit them to a public repository.'],
'Jobs':['kubectl create job hello --image=busybox:1.36 -- echo hello\nkubectl wait --for=condition=complete job/hello --timeout=90s\nkubectl logs job/hello\nkubectl get job hello','Jobs run finite workloads and track successful completions. A successful container exit marks the Job complete.','For failures inspect the created Pods and their logs; backoffLimit controls retries.'],
'CronJobs':['kubectl create cronjob hello --image=busybox:1.36 --schedule="*/5 * * * *" -- echo hello\nkubectl get cronjob hello\nkubectl create job manual-check --from=cronjob/hello\nkubectl logs job/manual-check','A CronJob creates Jobs according to its schedule. Manually creating a Job from the template allows immediate verification without waiting five minutes.','Check the schedule, timezone settings, suspended flag and Job history when troubleshooting.'],
'Probes: readiness':['kubectl explain deployment.spec.template.spec.containers.readinessProbe\nkubectl create deployment web --image=nginx\nkubectl get pods -l app=web -w','A readiness probe determines whether a container should receive Service traffic; a failing readiness probe does not itself restart the container.','Check readinessProbe path, port, initial delay, and Pod events.'],
'Probes: liveness':['kubectl explain pod.spec.containers.livenessProbe\nkubectl describe pod web','A liveness probe detects a stuck container and causes kubelet to restart it after the configured failure threshold.','A too-aggressive liveness probe can create a restart loop; use a startup probe for slow initialization.'],
'NetworkPolicies':['kubectl explain networkpolicy.spec\nkubectl get networkpolicies\nkubectl get pods --show-labels','NetworkPolicy selects Pods and describes allowed ingress/egress connections. Enforcement requires a compatible CNI; a policy object alone may have no effect in an unsupported local cluster.','Check namespace selectors, Pod labels, both traffic directions, and CNI support.'],
'RBAC basics':['kubectl create serviceaccount app-sa\nkubectl create role pod-reader --verb=get,list,watch --resource=pods\nkubectl create rolebinding read-pods --role=pod-reader --serviceaccount=default:app-sa\nkubectl auth can-i list pods --as=system:serviceaccount:default:app-sa','A Role grants permissions within a namespace; a RoleBinding assigns it to a user, group, or ServiceAccount. auth can-i tests the effective authorization.','The namespace of the ServiceAccount in the binding must match its real namespace.'],
'PersistentVolumeClaims':['kubectl get storageclass\nkubectl get pvc\nkubectl explain pvc.spec','A PVC requests storage and can be bound to a PV by the storage system. Dynamic provisioning depends on a working StorageClass and provisioner.','Pending PVCs often indicate no matching volume, no default StorageClass, or provisioning problems.']
};
function instructor(d){let q=deepFor(d),specific=answerGuides[d.title];let cmd=specific?specific[0].replaceAll('\\n','\n'):q[3].replaceAll('\\n','\n');let why=specific?specific[1]:q[1]+' '+q[2];let pit=specific?specific[2]:'Inspect the relevant resource, events, selectors, and object specification. A successful command is not proof of a correct running state.';return {cmd,why,pit};}
function answerPanel(d,kind){let a=instructor(d);return `<details class="solution"><summary>🔑 Reveal ${kind} worked answer and explanation</summary><h3>Reference solution — commands</h3>${codebox(a.cmd)}<h3>Why this works</h3><p>${esc(a.why)}</p><h3>Common failure and diagnosis</h3><p>${esc(a.pit)}</p><h3>How to verify your work</h3>${codebox('kubectl config current-context\nkubectl get pods -n ckad-lab -o wide\nkubectl get events -n ckad-lab --sort-by=.lastTimestamp\nkubectl describe pod -n ckad-lab <pod-name>')}<p><strong>Important:</strong> these are example solution paths, not automatic grading. Adjust resource names and namespace. If the task needs a controller, Service, storage or policy, inspect that object directly too.</p></details>`}
const originalLab=lab,originalProject=project,originalQuiz=quiz;
lab=function(d){let html=originalLab(d);return html.replace('</div>'+task('lab','I completed and verified the exercises in a real cluster.'),answerPanel(d,'exercise A, B and C')+'</div>'+task('lab','I completed and verified the exercises in a real cluster.'))};
project=function(d){let html=originalProject(d),a=instructor(d);let extra=`<details class="solution"><summary>🔑 Reveal mini-project walkthrough and expected result</summary><h3>Step 1: Plan</h3><p>${esc(d.project)}. Decide which Kubernetes resource represents the desired state and which labels, selectors, images, ports, and namespace it needs.</p><h3>Step 2: Build</h3>${codebox(a.cmd)}<h3>Step 3: Explain</h3><p>${esc(a.why)}</p><h3>Step 4: Validate and debug</h3><p>${esc(a.pit)}</p>${codebox('kubectl get all -n ckad-lab\nkubectl get events -n ckad-lab --sort-by=.lastTimestamp')}<p>For multi-resource projects, extend the reference commands to create every required object. The task is complete only when the intended behavior is demonstrated.</p></details>`;return html.replace('</div>'+task('project','I built and validated the mini project.'),extra+'</div>'+task('project','I built and validated the mini project.'))};
quiz=function(d){let html=originalQuiz(d),a=instructor(d);let extra=`<details class="solution"><summary>🔑 Five explained quiz answers</summary><ol><li><strong>What problem is solved?</strong> ${esc(a.why)}</li><li><strong>Which resource owns or selects it?</strong> Check the relevant spec and labels with <code>kubectl explain</code>, <code>kubectl get -o yaml</code> and <code>kubectl describe</code>. For example, a Deployment manages ReplicaSets, while a Service selects Pods; not all objects have owners.</li><li><strong>Scenario reasoning:</strong> ${esc(a.pit)}</li><li><strong>What command verifies it?</strong> Run the resource-specific command from the reference answer, then inspect the object status and any events. A zero exit code from <code>kubectl apply</code> alone does not prove readiness.</li><li><strong>How do you troubleshoot?</strong> Check namespace/context, object spec, selectors, Pod events, container logs, and any dependencies. Form a hypothesis from the observed status before editing.</li></ol><h3>Reference commands</h3>${codebox(a.cmd)}</details>`;return html.replace('</div>'+task('quiz','I answered at least 4/5 recall questions correctly.'),extra+'</div>'+task('quiz','I answered at least 4/5 recall questions correctly.'))};

const mockDefs=[{name:'Mock 1 — Foundations',mins:75,offset:0,count:12},{name:'Mock 2 — Application Skills',mins:90,offset:5,count:15},{name:'Mock 3 — Full Simulation A',mins:120,offset:0,count:17},{name:'Mock 4 — Full Simulation B',mins:120,offset:7,count:17},{name:'Mock 5 — Final Readiness',mins:120,offset:13,count:17}];
let mockMode=-1;const originalRender=render,originalNav=renderNav,originalSelect=select;
renderNav=function(){originalNav();let nav=document.querySelector('#nav');nav.insertAdjacentHTML('beforeend',`<div class="navgroup"><div class="groupname">TIMED PRACTICE EXAMS</div>${mockDefs.map((m,i)=>`<button class="day ${mockMode===i?'active':''}" data-mock="${i}"><span class="number">★</span><span>${esc(m.name)}</span></button>`).join('')}</div>`);document.querySelectorAll('[data-mock]').forEach(b=>b.onclick=()=>{mockMode=+b.dataset.mock;render();document.querySelector('#sidebar').classList.remove('open');document.querySelector('#overlay').classList.remove('open');window.scrollTo(0,0)})};
select=function(i){mockMode=-1;originalSelect(i)};
function mockRender(){const m=mockDefs[mockMode],tasks=Array.from({length:m.count},(_,i)=>mockTopics[(m.offset+i*3)%mockTopics.length]);const key='ckad-mock-'+mockMode;let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch{};const completed=tasks.filter((_,i)=>state[i]).length;document.querySelector('#content').innerHTML=`<div class="eyebrow">Original practice tasks · ${m.mins} minutes · ${m.count} tasks</div><h1>${esc(m.name)}</h1><p class="muted">These are authored CKAD-style exercises, not leaked or official exam questions. Use a real cluster and score the observed state. The website does not execute kubectl or automatically grade Kubernetes resources.</p><div class="stats"><div class="stat"><b>${completed}/${m.count}</b><small>Self-verified tasks</small></div><div class="stat"><b>${m.mins} min</b><small>Time limit</small></div><div class="stat"><b>${Math.round(completed/m.count*100)}%</b><small>Self-reported completion</small></div></div><div class="panel"><h2>Exam instructions</h2><p>Set a timer for ${m.mins} minutes. Work in a disposable cluster. For each task, use a separate namespace named <code>mock${mockMode+1}-tN</code> (N is task number). Create it before starting the task. Don't reveal the answer until after time expires. Mark a task only after validating the live resource. Score each task equally for practice; the real exam uses its own grading.</p><button class="primary" id="startMock">Start / restart ${m.mins}-minute timer</button> <strong id="mockClock" style="margin-left:12px;font-variant-numeric:tabular-nums">Not started</strong></div>${tasks.map((t,i)=>`<div class="panel reading"><h2>Task ${i+1} — ${esc(t[0])}</h2><p>${t[1]}</p><p><strong>Namespace:</strong> <code>mock${mockMode+1}-t${i+1}</code></p><details><summary>Reveal suggested solution / verification hint</summary>${codebox(t[2])}<p>Verify with <code>kubectl get</code>, <code>kubectl describe</code> and, where possible, a real request or test. This is a solution outline, not always a full manifest.</p></details><label class="task"><input type="checkbox" data-mockcheck="${i}" ${state[i]?'checked':''}> I verified this task in Kubernetes</label></div>`).join('')}<div class="panel"><h2>Debrief</h2><p>Record which tasks you could not complete, the exact error messages, and whether the issue was knowledge, speed, or verification. Reattempt failed tasks after 24–48 hours. Target at least 80% on multiple timed practice runs before exam day.</p><p><a href="https://github.com/cncf/curriculum/tree/main/ckad" target="_blank">Official CKAD curriculum</a> · <a href="https://kubernetes.io/docs/tasks/" target="_blank">Kubernetes tasks</a></p></div>`;document.querySelectorAll('[data-mockcheck]').forEach(c=>c.onchange=()=>{state[c.dataset.mockcheck]=c.checked;localStorage.setItem(key,JSON.stringify(state));let keep=window.__mockDeadline;mockRender();window.__mockDeadline=keep});document.querySelector('#startMock').onclick=()=>{window.__mockDeadline=Date.now()+m.mins*60000;updateClock()};updateClock()}
function updateClock(){let el=document.querySelector('#mockClock');if(!el)return;if(!window.__mockDeadline){el.textContent='Not started';return}let left=Math.max(0,Math.ceil((window.__mockDeadline-Date.now())/1000));el.textContent=left?`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} remaining`:'Time is up';}
setInterval(updateClock,1000);
render=function(){renderNav();if(mockMode>=0){mockRender();return}originalRender();document.querySelector('#content').insertAdjacentHTML('afterbegin',`<div style="padding:12px 16px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;margin-bottom:18px;color:#1e40af"><strong>Enhanced CKAD course:</strong> Deep lessons, guided labs, mini projects, recall tests and five timed mock exams. Official curriculum: <a href="https://github.com/cncf/curriculum/tree/main/ckad" target="_blank">CNCF CKAD</a>. Practice in a real cluster; the site cannot grade live resources.</div>`)};
render();
